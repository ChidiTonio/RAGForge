[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragforge"
version = "0.1.0"
description = "Evidence-grounded research intelligence system"
requires-python = ">=3.11"

dependencies = [
    "pypdf>=5,<7",
    "rank-bm25>=0.2.2,<0.3",
    "numpy>=1.26,<3",
]


[project.optional-dependencies]
web = [
    "streamlit>=1.40,<2",
]
dev = [
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]
dense = [
    "sentence-transformers>=3,<6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
